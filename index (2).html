<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: #030d1c; }
  body {
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .page {
    position: relative;
    width: 100%;
    max-width: 520px;
  }
  .page img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  /* Invisible tap area placed exactly over the WhatsApp button in the image */
  .wa-link {
    position: absolute;
    left: 20.5%;
    top: 71.2%;
    width: 59.2%;
    height: 8.6%;
    border-radius: 999px;
    display: block;
  }
  .wa-link:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }
  .wa-link:active { background: rgba(255,255,255,.08); }

  /* Motion effect over the circular SE logo (center of the image) */
  .logo-fx {
    position: absolute;
    left: 31.7%;
    top: 36.3%;
    width: 36.7%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    pointer-events: none;
    overflow: hidden;
    animation: glow 3.2s ease-in-out infinite;
  }
  /* light sweep that glides across the silver */
  .logo-fx::before {
    content: "";
    position: absolute;
    top: -20%;
    left: -60%;
    width: 45%;
    height: 140%;
    background: linear-gradient(105deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.55) 50%,
      rgba(255,255,255,0) 100%);
    mix-blend-mode: screen;
    transform: skewX(-12deg);
    animation: sweep 3.6s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { left: -60%; opacity: 0; }
    15%  { opacity: 1; }
    55%  { left: 115%; opacity: 1; }
    100% { left: 115%; opacity: 0; }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 10px 0 rgba(150,200,255,.18), inset 0 0 12px rgba(190,225,255,.05); }
    50%      { box-shadow: 0 0 34px 6px rgba(150,200,255,.50), inset 0 0 22px rgba(190,225,255,.18); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo-fx, .logo-fx::before { animation: none; }
  }

  @media (min-width: 521px) {
    body { align-items: flex-start; }
  }
</style>
